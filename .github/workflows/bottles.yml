name: Bottles
# Builds precompiled bottles whenever the formula changes, so `brew install` and
# `brew upgrade` download rightcommit instead of compiling it.
on:
  push:
    branches: [main]
    paths: [Formula/rightcommit.rb]
  workflow_dispatch:

permissions:
  contents: write

concurrency: bottles

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
      # The publish job adds a bottle block to the formula; then there is nothing left to build.
      - id: check
        run: |
          if grep -q '^  bottle do' Formula/rightcommit.rb; then echo needed=false; else echo needed=true; fi >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    # Apple Silicon only: Intel Macs keep compiling from source.
    runs-on: macos-15
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Build, test and bottle rightcommit
        run: |
          pkg=$(brew info --json=v2 rightcommit/tap/rightcommit | jq -r '.formulae[0] | .versions.stable + (if .revision > 0 then "_\(.revision)" else "" end)')
          brew install --build-bottle rightcommit/tap/rightcommit
          brew test rightcommit/tap/rightcommit
          brew bottle --json --root-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/rightcommit-${pkg}" rightcommit/tap/rightcommit
      - uses: actions/upload-artifact@v7
        with:
          name: bottle-macos-15
          path: "*.bottle.*"
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/download-artifact@v8
        with:
          pattern: bottle-*
          merge-multiple: true
      - name: Upload the bottles and add them to the formula
        run: |
          pkg=$(brew info --json=v2 rightcommit/tap/rightcommit | jq -r '.formulae[0] | .versions.stable + (if .revision > 0 then "_\(.revision)" else "" end)')
          for json in *.bottle.json; do
            mv "$(jq -r '.[].bottle.tags[].local_filename' "$json")" "$(jq -r '.[].bottle.tags[].filename' "$json")"
          done
          if gh release view "rightcommit-${pkg}" >/dev/null 2>&1; then
            gh release upload "rightcommit-${pkg}" *.bottle*.tar.gz --clobber
          else
            gh release create "rightcommit-${pkg}" *.bottle*.tar.gz --title "rightcommit ${pkg} bottles" \
              --notes "Precompiled Homebrew bottles for rightcommit ${pkg}. Install with \`brew install rightcommit/tap/rightcommit\`." --latest=false
          fi
          brew bottle --merge --write --no-commit *.bottle.json
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rightcommit.rb
          git commit -m "rightcommit ${pkg}: add bottles"
          git pull --rebase origin main
          git push origin HEAD:main
